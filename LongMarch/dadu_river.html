<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>强渡大渡河 · 安顺场战斗态势演示</title>
<style>
  :root{
    --bg:#0a0e16; --bg2:#0f1a28;
    --panel:rgba(13,21,33,.92); --line:rgba(224,183,92,.22);
    --ink:#eaf1fb; --muted:#a7b6c9; --faint:#6f8094;
    --red:#e23b2e; --red2:#ff7a6d; --reddeep:#8f1610;
    --blue:#4f86bd; --blue2:#9cc0e8; --bluedeep:#21364c;
    --river:#15545c; --river2:#46bccb;
    --gold:#e0b75c; --gold2:#f6d98a;
    --font:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC","Source Han Sans SC","Heiti SC",sans-serif;
    --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font); color:var(--ink);
    background:
      radial-gradient(120% 120% at 70% -10%, #16243a 0%, var(--bg2) 38%, var(--bg) 78%);
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;flex-direction:column;height:100vh;width:100vw}

  /* ===== Header ===== */
  header{
    display:flex;align-items:center;gap:16px;
    padding:12px 22px 11px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(10,14,22,.6), rgba(10,14,22,0));
    flex:none;
  }
  .badge{
    width:38px;height:38px;flex:none;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--red2), var(--reddeep));
    box-shadow:0 0 0 2px rgba(224,183,92,.5), 0 4px 14px rgba(226,59,46,.4);
    display:grid;place-items:center; color:#ffe9b0; font-size:20px;
  }
  .titles h1{font-size:21px;letter-spacing:.16em;font-weight:800}
  .titles .sub{font-family:var(--serif);font-size:12.5px;color:var(--gold);letter-spacing:.22em;margin-top:3px}
  .spacer{flex:1}
  .topbtn{
    border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);
    padding:7px 12px;border-radius:8px;font-family:var(--font);font-size:12.5px;cursor:pointer;
    letter-spacing:.05em;transition:.18s;
  }
  .topbtn:hover{color:var(--ink);border-color:var(--gold);background:rgba(224,183,92,.08)}

  /* ===== Body ===== */
  .body{flex:1;display:flex;min-height:0}
  .mapwrap{position:relative;flex:1;min-width:0;padding:14px 8px 14px 16px}
  .frame{
    position:absolute;inset:14px 8px 14px 16px;border:1px solid var(--line);border-radius:10px;
    pointer-events:none;box-shadow:inset 0 0 60px rgba(0,0,0,.55);
  }
  svg.map{width:100%;height:100%;display:block}

  /* ===== Side panel ===== */
  aside{
    width:332px;flex:none;border-left:1px solid var(--line);
    background:var(--panel);padding:16px 16px 12px;display:flex;flex-direction:column;gap:12px;
    overflow:hidden;
  }
  .ph{font-size:12px;letter-spacing:.28em;color:var(--gold);font-weight:700;
      display:flex;align-items:center;gap:8px}
  .ph::after{content:"";flex:1;height:1px;background:var(--line)}
  .force{display:flex;flex-direction:column;gap:11px;overflow-y:auto;padding-right:2px}
  .fcard{border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:11px 12px;
         background:rgba(255,255,255,.015)}
  .fcard.red{border-top:3px solid var(--red)}
  .fcard.blue{border-top:3px solid var(--blue)}
  .fcard .side{font-size:13px;font-weight:800;letter-spacing:.1em;margin-bottom:5px;display:flex;gap:7px;align-items:center}
  .fcard.red .side{color:var(--red2)} .fcard.blue .side{color:var(--blue2)}
  .dot{width:9px;height:9px;border-radius:2px}
  .fcard.red .dot{background:var(--red)} .fcard.blue .dot{background:var(--blue)}
  .fcard p{font-size:12.5px;line-height:1.62;color:var(--muted)}
  .fcard b{color:var(--ink);font-weight:600}
  .pnote{font-size:10.5px;color:var(--faint);letter-spacing:.04em;line-height:1.5;margin-top:auto;padding-top:6px}

  /* ===== Footer / controls ===== */
  footer{flex:none;border-top:1px solid var(--line);
    background:linear-gradient(0deg, rgba(10,14,22,.55), rgba(10,14,22,0));
    padding:13px 22px 15px}
  .caption{display:flex;align-items:baseline;gap:14px;margin-bottom:13px;min-height:42px}
  .cap-name{font-size:19px;font-weight:800;letter-spacing:.05em;white-space:nowrap}
  .cap-time{font-family:var(--serif);font-size:12px;color:#0a0e16;background:var(--gold);
    padding:3px 9px;border-radius:20px;letter-spacing:.08em;white-space:nowrap;font-weight:700}
  .cap-desc{font-size:13px;color:var(--muted);line-height:1.55;flex:1}

  /* timeline */
  .track{position:relative;height:46px;margin:0 6px 12px}
  .rail{position:absolute;top:10px;left:0;right:0;height:3px;background:rgba(255,255,255,.09);border-radius:2px}
  .rail-fill{position:absolute;top:10px;left:0;height:3px;background:linear-gradient(90deg,var(--reddeep),var(--gold));border-radius:2px;transition:width .5s ease;width:0}
  .nodes{position:absolute;inset:0;display:flex;justify-content:space-between}
  .node{display:flex;flex-direction:column;align-items:center;cursor:pointer;width:16%;}
  .node .nd{width:15px;height:15px;border-radius:50%;border:2px solid var(--faint);
    background:var(--bg);margin-top:3px;transition:.25s;position:relative;z-index:2}
  .node .nl{font-size:11px;color:var(--faint);margin-top:7px;letter-spacing:.04em;transition:.2s;text-align:center;white-space:nowrap}
  .node.done .nd{border-color:var(--red);background:var(--red)}
  .node.active .nd{border-color:var(--gold);background:var(--gold);
    box-shadow:0 0 0 4px rgba(224,183,92,.22);transform:scale(1.25)}
  .node.active .nl{color:var(--gold2);font-weight:700}
  .node:hover .nl{color:var(--ink)}

  .ctrls{display:flex;align-items:center;justify-content:center;gap:11px}
  button.ctl{
    font-family:var(--font);font-size:13px;letter-spacing:.05em;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);
    padding:9px 16px;border-radius:9px;transition:.16s;display:flex;align-items:center;gap:7px
  }
  button.ctl:hover{border-color:var(--gold);background:rgba(224,183,92,.1)}
  button.ctl:disabled{opacity:.32;cursor:default;border-color:var(--line);background:transparent}
  button.ctl.primary{
    background:linear-gradient(180deg,var(--red),var(--reddeep));border-color:var(--red2);
    color:#fff;font-weight:700;padding:9px 22px;box-shadow:0 4px 16px rgba(226,59,46,.32)
  }
  button.ctl.primary:hover{filter:brightness(1.08)}
  .ctl .ic{font-size:14px;line-height:1}

  /* hint toast */
  .toast{position:absolute;top:26px;left:50%;transform:translateX(-50%);
    background:rgba(13,21,33,.94);border:1px solid var(--gold);color:var(--gold2);
    padding:9px 18px;border-radius:30px;font-size:12.5px;letter-spacing:.06em;z-index:30;
    box-shadow:0 8px 30px rgba(0,0,0,.5);transition:opacity .5s;pointer-events:none}

  /* ===== SVG element styles ===== */
  .unit{transition:transform 1.5s cubic-bezier(.45,.05,.2,1), opacity .55s ease; cursor:default}
  .unit.hidden{opacity:0}
  .pill{fill:var(--reddeep);stroke:var(--red2);stroke-width:1.4;filter:url(#softsh)}
  .pill.blue{fill:var(--bluedeep);stroke:var(--blue2)}
  .u-name{fill:#fff;font-size:15px;font-weight:700;text-anchor:middle;letter-spacing:.04em}
  .u-sub{fill:var(--gold2);font-size:11.5px;text-anchor:middle;letter-spacing:.03em}
  .u-sub.blue{fill:var(--blue2)}
  .flag{fill:var(--red2)}
  .boatHull{fill:#6b4a2e;stroke:#c79b63;stroke-width:1.4}
  .mast{stroke:#c79b63;stroke-width:1.6}
  .firemk{fill:var(--reddeep);stroke:var(--gold);stroke-width:1.3}
  .firemk-l{fill:var(--gold2);font-size:11px;text-anchor:middle;letter-spacing:.02em}
  .fireline{stroke:var(--red2);stroke-width:2.4;stroke-dasharray:7 9;opacity:0;
    filter:drop-shadow(0 0 4px rgba(255,122,109,.8))}
  .fireline.firing{opacity:.9;animation:tracer .5s linear infinite, flick 1.1s ease-in-out infinite}
  @keyframes tracer{to{stroke-dashoffset:-32}}
  @keyframes flick{0%,100%{opacity:.45}50%{opacity:.95}}
  .worksglyph{fill:none;stroke:var(--blue2);stroke-width:2}
  .flagpole{stroke:#e8e8e8;stroke-width:2}
  #flag .bigflag{fill:var(--red);transform-origin:left center;transition:transform .7s cubic-bezier(.2,1.4,.4,1),opacity .5s}
  #flag.down .bigflag{transform:scaleX(0);opacity:0}
  .colarrow{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;
    marker-end:url(#redhead);filter:drop-shadow(0 0 5px rgba(226,59,46,.5));
    stroke-dasharray:600;stroke-dashoffset:600;transition:stroke-dashoffset 1.6s ease}
  .colarrow.draw{stroke-dashoffset:0}
  .col-l{fill:var(--red2);font-size:13px;font-weight:700;letter-spacing:.06em}
  .stratlbl{fill:var(--muted);font-size:12.5px;letter-spacing:.05em}
  .stratlbl.blue{fill:var(--blue2)}
  .stratarrow{stroke:var(--blue);stroke-width:3;marker-end:url(#bluehead);opacity:.8}
  .pursuit{stroke:var(--blue);stroke-width:3.5;marker-end:url(#bluehead);opacity:.85;stroke-dasharray:9 7}
  .label-place{fill:var(--gold2);font-size:14px;font-weight:700;letter-spacing:.05em}
  .label-river{fill:#bfeef4;font-size:26px;font-weight:800;letter-spacing:.5em;opacity:.5}
  .flowdash{fill:none;stroke:rgba(180,240,248,.45);stroke-width:2.2;stroke-dasharray:2 18;
    stroke-linecap:round;animation:flow 2.4s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-40}}
  .nightveil{fill:#04101f;opacity:0;transition:opacity 1s ease;pointer-events:none}
  .nightveil.on{opacity:.42}
  .follow{}
  .contour{fill:none;stroke:rgba(224,183,92,.06);stroke-width:1.2}
  .ridge{fill:rgba(255,255,255,.025);stroke:rgba(224,183,92,.10);stroke-width:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="badge">★</div>
    <div class="titles">
      <h1>强 渡 大 渡 河 · 安 顺 场 战 斗</h1>
      <div class="sub">敌我态势动态推演 　 1935·5·24 — 5·25</div>
    </div>
    <div class="spacer"></div>
    <button class="topbtn" id="helpBtn">操作说明</button>
    <button class="topbtn" id="fsBtn">⛶ 全屏</button>
  </header>

  <div class="body">
    <div class="mapwrap">
      <div class="frame"></div>
      <div class="toast" id="toast">按　→ / 空格　或点「演示下一段」推进　·　← 后退　·　F 全屏</div>
      <svg class="map" viewBox="0 0 1280 760" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="riverGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2a8a93"/>
            <stop offset="0.5" stop-color="#15545c"/>
            <stop offset="1" stop-color="#0c373d"/>
          </linearGradient>
          <radialGradient id="vig" cx="55%" cy="40%" r="75%">
            <stop offset="60%" stop-color="rgba(0,0,0,0)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,.45)"/>
          </radialGradient>
          <filter id="softsh" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".5"/>
          </filter>
          <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
            <feColorMatrix type="saturate" values="0"/></filter>
          <marker id="redhead" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
            <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--red)"/></marker>
          <marker id="bluehead" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
            <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--blue)"/></marker>
        </defs>

        <!-- background atmosphere -->
        <rect x="0" y="0" width="1280" height="760" fill="url(#grain)" opacity="0.04"/>
        <g class="contours">
          <path class="contour" d="M-20,150 C 200,110 380,200 600,160 S 1000,120 1300,180"/>
          <path class="contour" d="M-20,110 C 220,70 420,160 640,120 S 1020,80 1300,140"/>
          <path class="contour" d="M-20,640 C 240,690 460,610 700,650 S 1060,700 1300,650"/>
          <path class="contour" d="M-20,690 C 240,740 460,660 700,700 S 1060,748 1300,700"/>
        </g>
        <!-- ridge hints -->
        <path class="ridge" d="M40,250 L120,140 L210,250 Z"/>
        <path class="ridge" d="M150,250 L230,160 L320,250 Z"/>
        <path class="ridge" d="M980,210 L1060,120 L1150,210 Z"/>

        <!-- ===== RIVER (大渡河) ===== -->
        <path d="M-60,400 C 240,360 460,448 700,404 S 1080,368 1340,414"
              fill="none" stroke="url(#riverGrad)" stroke-width="150" stroke-linecap="round"/>
        <path d="M-60,400 C 240,360 460,448 700,404 S 1080,368 1340,414"
              class="flowdash" fill="none"/>
        <text class="label-river" x="270" y="412" transform="rotate(-4 270 412)">大渡河</text>
        <text x="1120" y="392" fill="#bfeef4" font-size="13" opacity=".7" letter-spacing=".1em">水流湍急 →</text>

        <!-- bank labels -->
        <text x="60" y="300" fill="var(--muted)" font-size="14" letter-spacing=".25em" opacity=".7">北　岸（对岸）</text>
        <text x="60" y="540" fill="var(--muted)" font-size="14" letter-spacing=".25em" opacity=".7">南　岸</text>

        <!-- 安顺场渡口 -->
        <g transform="translate(560,512)">
          <path d="M-30,8 L30,8 M0,8 L0,28" stroke="var(--gold)" stroke-width="2.5"/>
          <circle cx="0" cy="8" r="4" fill="var(--gold2)"/>
          <text class="label-place" x="0" y="50" text-anchor="middle">安顺场渡口</text>
        </g>

        <!-- compass -->
        <g transform="translate(1185,86)" opacity=".8">
          <circle r="22" fill="none" stroke="var(--line)" stroke-width="1.2"/>
          <path d="M0,-20 L5,0 L0,-6 L-5,0 Z" fill="var(--red2)"/>
          <path d="M0,20 L5,0 L0,6 L-5,0 Z" fill="var(--muted)"/>
          <text x="0" y="-26" text-anchor="middle" fill="var(--muted)" font-size="11">北</text>
        </g>

        <!-- ===== strategic context (scene 0) ===== -->
        <g id="s_xueyue" class="unit">
          <path class="pursuit" d="M560,742 L560,668"/>
          <text class="stratlbl blue" x="572" y="730">薛岳部　约10万（沿云南方向尾追）</text>
        </g>
        <g id="s_liuwenhui" class="unit">
          <path class="stratarrow" d="M250,250 L250,330" stroke-dasharray="6 6"/>
          <path class="stratarrow" d="M980,250 L980,330" stroke-dasharray="6 6"/>
          <text class="stratlbl blue" x="820" y="232">刘文辉部　约20万（沿大渡河布防，企图聚歼于南岸）</text>
        </g>

        <!-- ===== fire lines (south bank → north works) ===== -->
        <path id="fl1" class="fireline" d="M455,548 L676,228"/>
        <path id="fl2" class="fireline" d="M665,548 L700,232"/>

        <!-- ===== columns (scene 5) ===== -->
        <path id="col_w" class="colarrow" d="M505,600 C 380,540 250,420 150,230"/>
        <path id="col_e" class="colarrow" d="M700,250 C 520,210 320,180 175,165"/>
        <text id="col_wl" class="col-l unit" x="300" y="500">西岸纵队</text>
        <text id="col_el" class="col-l unit" x="360" y="150">东岸纵队</text>
        <g id="s_luding" class="unit" transform="translate(96,150)">
          <path d="M-30,0 L30,0 M-30,0 L-30,-12 M-10,0 L-10,-12 M10,0 L10,-12 M30,0 L30,-12"
                stroke="var(--gold2)" stroke-width="2" fill="none"/>
          <text class="label-place" x="0" y="-22" text-anchor="middle">泸定桥方向</text>
        </g>

        <!-- ===== ENEMY units ===== -->
        <g class="unit blue" id="u_enemyN">
          <path class="worksglyph" d="M-58,14 L-58,2 L-44,2 L-44,-6 L-30,-6 L-30,2 L58,2 L58,14"/>
          <rect class="pill blue" x="-56" y="-30" width="112" height="30" rx="6"/>
          <text class="u-name" y="-10">川军·北岸工事</text>
          <text class="u-sub blue" y="32">刘文辉部 约2个连</text>
        </g>
        <g class="unit blue" id="u_enemyS">
          <rect class="pill blue" x="-40" y="-15" width="80" height="30" rx="6"/>
          <text class="u-name" y="5" font-size="13">渡口守敌</text>
        </g>

        <!-- ===== fire markers ===== -->
        <g class="unit" id="u_fire_mg">
          <rect class="firemk" x="-13" y="-9" width="26" height="18" rx="3"/>
          <text class="firemk-l" y="26">机枪火力</text>
        </g>
        <g class="unit" id="u_fire_mortar">
          <polygon class="firemk" points="0,-12 12,9 -12,9"/>
          <text class="firemk-l" y="26">迫击炮·赵章成</text>
        </g>

        <!-- ===== RED units ===== -->
        <g class="unit" id="u_follow">
          <rect class="pill" x="-38" y="-14" width="76" height="28" rx="6"/>
          <text class="u-name" y="4" font-size="13">后续梯队</text>
        </g>

        <g class="unit" id="u_red1">
          <polygon class="flag" points="-50,-17 -50,-31 -24,-24 -50,-17"/>
          <line x1="-50" y1="-17" x2="-50" y2="2" stroke="var(--red2)" stroke-width="1.6"/>
          <rect class="pill" x="-46" y="-16" width="92" height="32" rx="7"/>
          <text class="u-name" y="4">红１团</text>
          <text class="u-sub" y="32">先遣队·杨得志</text>
        </g>

        <g id="flag" class="down" transform="translate(665,236)">
          <line class="flagpole" x1="0" y1="0" x2="0" y2="34"/>
          <polygon class="bigflag" points="0,0 0,16 26,8"/>
        </g>

        <g class="unit" id="u_assault">
          <path class="boatHull" d="M-26,7 Q0,23 26,7 L21,-3 L-21,-3 Z"/>
          <line class="mast" x1="0" y1="-3" x2="0" y2="-22"/>
          <polygon class="flag" points="0,-22 0,-12 16,-17"/>
          <text class="u-sub" y="36">十七勇士</text>
        </g>

        <!-- night veil -->
        <rect class="nightveil" id="nightveil" x="0" y="0" width="1280" height="760"/>
        <rect x="0" y="0" width="1280" height="760" fill="url(#vig)" pointer-events="none"/>
      </svg>
    </div>

    <aside>
      <div class="ph">兵力对比 · 态势</div>
      <div class="force">
        <div class="fcard red">
          <div class="side"><span class="dot"></span>红军（中央红军先遣队）</div>
          <p id="redForce"></p>
        </div>
        <div class="fcard blue">
          <div class="side"><span class="dot"></span>守敌（川军刘文辉部）</div>
          <p id="blueForce"></p>
        </div>
      </div>
      <div class="pnote">说明：本图为教学示意态势，单位位置与河道为示意，非按实际地理比例。兵力数据依史料综述，均为概数。</div>
    </aside>
  </div>

  <footer>
    <div class="caption">
      <span class="cap-name" id="capName"></span>
      <span class="cap-time" id="capTime"></span>
      <span class="cap-desc" id="capDesc"></span>
    </div>
    <div class="track">
      <div class="rail"></div>
      <div class="rail-fill" id="railFill"></div>
      <div class="nodes" id="nodes"></div>
    </div>
    <div class="ctrls">
      <button class="ctl" id="prevBtn"><span class="ic">◀</span>上一步</button>
      <button class="ctl primary" id="nextBtn"><span class="ic">▶</span><span id="nextLbl">演示下一段</span></button>
      <button class="ctl" id="replayBtn"><span class="ic">↻</span>重播本段</button>
      <button class="ctl" id="autoBtn"><span class="ic">⏯</span>自动播放</button>
    </div>
  </footer>
</div>

<script>
"use strict";
const SCENES = [
  { name:"初始态势", time:"1935年5月",
    desc:"红军巧渡金沙江后挥师北上，被大渡河天险所阻；敌企图凭天险将红军聚歼于南岸，重演石达开兵败覆灭旧事。",
    red:"<b>中央红军主力 约2万余人</b>；先遣队·红1团（团长杨得志、营长孙继先）。长途行军极度疲惫，缺粮少弹，无重型火力与渡河装备。",
    blue:"<b>刘文辉部第24军</b>：安顺场及对岸守敌 约2个连，控制船只、北岸构筑工事封锁江面。后方：<b>薛岳部约10万</b>尾追、<b>刘文辉部约20万</b>沿河布防。" },
  { name:"夜袭夺取渡口", time:"5月24日 夜",
    desc:"红1团长途奔袭安顺场，乘夜奇袭，一举夺占南岸渡口、缴获木船一只——强渡有了立足点。",
    red:"红1团夜袭安顺场，奇袭夺占南岸渡口，<b>缴获木船 1 只</b>（后增至数只）。",
    blue:"南岸渡口守敌一部被歼、被驱散；<b>北岸主阵地工事未动</b>，继续封锁江面。" },
  { name:"组织强渡 · 火力部署", time:"5月25日 晨",
    desc:"孙继先挑选十七勇士组成奋勇队登船强渡；南岸集中机枪与迫击炮（赵章成），对北岸工事实施火力掩护。",
    red:"孙继先组织<b>奋勇队·十七勇士</b>登船；南岸集中机枪、迫击炮（赵章成）<b>火力掩护</b>。",
    blue:"川军据守北岸工事，居高临下，以火力封锁约百米宽的江面。" },
  { name:"勇士抢渡大渡河", time:"5月25日",
    desc:"木船在湍急江流中强渡、被水流冲偏；南岸火力全力压制北岸敌火，勇士冒着弹雨向对岸突进。",
    red:"木船强渡湍急江面、被急流冲向下游；<b>南岸火力全力压制</b>北岸敌火，勇士冒弹前进。",
    blue:"凭工事居高射击，企图将渡船击毁、阻敌于江心。" },
  { name:"抢滩夺岸 · 巩固滩头", time:"5月25日",
    desc:"十七勇士强行登岸，突击摧毁敌前沿工事，夺占滩头阵地；后续梯队依托木船陆续渡河。",
    red:"十七勇士强行登岸，突击夺占敌前沿工事、<b>巩固滩头</b>；后续梯队续渡。",
    blue:"北岸前沿防御被突破，渡口阵地易手。" },
  { name:"兵分两路 · 奔袭泸定桥", time:"5月25日后",
    desc:"渡口船少，难以及时渡完全军，而敌正合拢——中革军委机断决策：兵分两路、夹江北上，奔袭夺取泸定桥（次日即“飞夺泸定桥”）。",
    red:"木船仅数只、渡完全军需以周计；中革军委决断：<b>兵分两路、夹江北上、奔袭泸定桥</b>，为主力打开新通道。",
    blue:"大渡河防线被撕开，妄图聚歼红军于南岸的企图彻底落空。" }
];
const NODE_LABELS = ["初始态势","夜袭夺渡口","组织强渡","勇士抢渡","抢滩夺岸","兵分两路"];
const LAST = SCENES.length - 1;

/* base positions (SVG user units) */
const POS = {
  u_red1:        {s:[420,635], a:[505,588]},
  u_enemyN:      [690,212],
  u_enemyS:      [560,470],
  u_fire_mg:     [455,560],
  u_fire_mortar: [665,560],
  u_follow:      [600,360],
  assaultDock:   [560,512],
  assaultLand:   [665,250],
  flag:          [665,236]
};
const $ = id => document.getElementById(id);
const els = {};
["u_red1","u_enemyN","u_enemyS","u_fire_mg","u_fire_mortar","u_follow","u_assault",
 "flag","fl1","fl2","col_w","col_e","col_wl","col_el","s_luding","s_xueyue","s_liuwenhui",
 "nightveil","capName","capTime","capDesc","redForce","blueForce","railFill","nodes",
 "prevBtn","nextBtn","replayBtn","autoBtn","nextLbl"].forEach(k=>els[k]=$(k));

let scene = 0, token = 0, boatRAF = null, auto = false;
const timers = [];
function clearTimers(){ timers.forEach(clearTimeout); timers.length=0;
  if(boatRAF){cancelAnimationFrame(boatRAF); boatRAF=null;} }
function setT(fn,ms){ const id=setTimeout(fn,ms); timers.push(id); return id; }
const T = (el,x,y) => { el.style.transform = `translate(${x}px,${y}px)`; };
const show = (el,on) => el.classList.toggle("hidden", !on);

/* boat curved crossing (quadratic Bézier), continuous */
function crossBoat(dur, tok){
  const P0=POS.assaultDock, P1=[706,378], P2=POS.assaultLand;
  const t0=performance.now();
  show(els.u_assault,true);
  T(els.u_assault, P0[0], P0[1]);
  (function frame(now){
    if(tok!==token) return;
    const t=Math.min(1,(now-t0)/dur), u=1-t;
    const x=u*u*P0[0]+2*u*t*P1[0]+t*t*P2[0];
    const y=u*u*P0[1]+2*u*t*P1[1]+t*t*P2[1];
    T(els.u_assault,x,y);
    if(t<1) boatRAF=requestAnimationFrame(frame);
  })(performance.now());
}

function setBoat(state, animate, tok){
  els.u_assault.style.transition = animate ? "" : "none";
  if(state==="hidden"){ show(els.u_assault,false); T(els.u_assault,POS.assaultDock[0],POS.assaultDock[1]); }
  else if(state==="dock"){ show(els.u_assault,true); T(els.u_assault,POS.assaultDock[0],POS.assaultDock[1]); }
  else if(state==="land"){ show(els.u_assault,true); T(els.u_assault,POS.assaultLand[0],POS.assaultLand[1]); }
  else if(state==="cross"){ if(animate) crossBoat(4600,tok); else { show(els.u_assault,true); T(els.u_assault,POS.assaultLand[0],POS.assaultLand[1]); } }
}

function applyScene(n, animate){
  token++; const tok = token; clearTimers();

  /* static positions */
  T(els.u_enemyN, ...POS.u_enemyN);
  T(els.u_fire_mg, ...POS.u_fire_mg);
  T(els.u_fire_mortar, ...POS.u_fire_mortar);
  T(els.u_follow, ...POS.u_follow);
  T(els.flag, ...POS.flag);

  /* red1 */
  els.u_red1.style.transition = animate ? "" : "none";
  T(els.u_red1, ...(n===0 ? POS.u_red1.s : POS.u_red1.a));

  /* visibility per scene */
  show(els.s_xueyue, n===0);
  show(els.s_liuwenhui, n===0);
  show(els.u_enemyS, n<=1);
  show(els.u_fire_mg, n>=2 && n<=4);
  show(els.u_fire_mortar, n>=2 && n<=4);
  show(els.u_follow, n===4);
  els.nightveil.classList.toggle("on", n===1);

  /* fire lines */
  const firing = (n===3 || n===4);
  els.fl1.classList.toggle("firing", firing);
  els.fl2.classList.toggle("firing", firing);

  /* flag */
  els.flag.classList.toggle("down", n<4);

  /* columns (scene 5) */
  const col = (n===5);
  show(els.col_wl, col); show(els.col_el, col); show(els.s_luding, col);
  if(col){
    if(animate){ els.col_w.classList.remove("draw"); els.col_e.classList.remove("draw");
      setT(()=>{els.col_w.classList.add("draw");},120);
      setT(()=>{els.col_e.classList.add("draw");},520);
    } else { els.col_w.classList.add("draw"); els.col_e.classList.add("draw"); }
  } else { els.col_w.classList.remove("draw"); els.col_e.classList.remove("draw"); }

  /* red1 hidden in scene5 (columns represent the army) */
  show(els.u_red1, n!==5);

  /* boat */
  if(n<=1)      setBoat("hidden", animate, tok);
  else if(n===2) setBoat("dock",  animate, tok);
  else if(n===3) setBoat("cross", animate, tok);
  else if(n===4) setBoat("land",  animate, tok);
  else           setBoat("hidden",animate, tok);

  /* restore transitions after a no-anim jump */
  if(!animate){
    requestAnimationFrame(()=>{ els.u_red1.style.transition=""; els.u_assault.style.transition=""; });
  }

  renderUI(n);
}

function renderUI(n){
  const sc = SCENES[n];
  els.capName.textContent = sc.name;
  els.capTime.textContent = sc.time;
  els.capDesc.textContent = sc.desc;
  els.redForce.innerHTML = sc.red;
  els.blueForce.innerHTML = sc.blue;
  els.railFill.style.width = (n/(LAST)*100) + "%";
  document.querySelectorAll(".node").forEach((nd,i)=>{
    nd.classList.toggle("active", i===n);
    nd.classList.toggle("done", i<n);
  });
  els.prevBtn.disabled = (n===0);
  els.nextLbl.textContent = (n===LAST) ? "重新开始" : "演示下一段";
  els.nextBtn.querySelector(".ic").textContent = (n===LAST) ? "↺" : "▶";
}

function goTo(n, animate){
  n = Math.max(0, Math.min(LAST, n));
  scene = n;
  applyScene(n, animate);
}
function next(){ if(scene>=LAST){ stopAuto(); goTo(0,false); } else goTo(scene+1, true); }
function prev(){ stopAuto(); if(scene>0) goTo(scene-1, false); }
function replay(){
  stopAuto();
  const cur = scene;
  if(cur===0){ goTo(0,true); return; }
  goTo(cur-1, false);
  setT(()=>{ scene=cur; applyScene(cur, true); }, 90);
}

/* autoplay */
const SCENE_DUR = [1600, 2200, 2000, 5200, 2600, 2600];
function autoStep(){
  if(!auto) return;
  if(scene>=LAST){ stopAuto(); return; }
  goTo(scene+1, true);
  setT(()=>{ if(auto) autoStep(); }, (SCENE_DUR[scene]||2200) + 1600);
}
function startAuto(){ auto=true; els.autoBtn.querySelector(".ic").textContent="❚❚";
  els.autoBtn.lastChild.textContent="暂停播放"; if(scene>=LAST) goTo(0,false); autoStep(); }
function stopAuto(){ auto=false; els.autoBtn.querySelector(".ic").textContent="⏯";
  els.autoBtn.lastChild.textContent="自动播放"; }
function toggleAuto(){ auto ? stopAuto() : startAuto(); }

/* build timeline nodes */
NODE_LABELS.forEach((lbl,i)=>{
  const node=document.createElement("div");
  node.className="node";
  node.innerHTML=`<div class="nd"></div><div class="nl">${lbl}</div>`;
  node.addEventListener("click",()=>{ stopAuto(); goTo(i,false); });
  els.nodes.appendChild(node);
});

/* controls */
els.nextBtn.addEventListener("click", next);
els.prevBtn.addEventListener("click", prev);
els.replayBtn.addEventListener("click", replay);
els.autoBtn.addEventListener("click", toggleAuto);
$("fsBtn").addEventListener("click", ()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});
$("helpBtn").addEventListener("click", ()=>{
  alert("操作说明\n\n· 点「演示下一段」或按 → / 空格：播放本段动画并进入下一时间节点\n· ← ：返回上一节点\n· 点底部时间轴圆点：直接跳到该节点\n· 「重播本段」：重新播放当前这段动画\n· 「自动播放」：连续自动演示全程\n· F 或右上「全屏」：进入全屏演示");
});
document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight"||e.key===" "){ e.preventDefault(); next(); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); prev(); }
  else if(e.key.toLowerCase()==="r"){ replay(); }
  else if(e.key.toLowerCase()==="f"){ $("fsBtn").click(); }
});

/* hint toast auto-hide */
setTimeout(()=>{ const t=$("toast"); if(t) t.style.opacity="0"; }, 5200);
document.querySelector(".mapwrap").addEventListener("click",()=>{ const t=$("toast"); if(t) t.style.opacity="0"; });

/* init */
goTo(0,false);
</script>
</body>
</html>
