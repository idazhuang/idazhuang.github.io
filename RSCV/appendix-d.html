<div class="pagehead"><div class="eyebrow"><a href="index.html">首页</a><span>›</span><span class="chip">附录</span></div><h1 class="title">附录 D · 冷邮件模板（中英双语）</h1><p class="subtitle">用 12 个月准备的那一击，模板在这里</p></div>
<div class="note"><b>这份模板原本应该在「附录 D」</b>　全书写着「附录 D 有邮件模板」、提到冷邮件 <b>152 次</b>，但原资料里没有附录，也没有任何一封邮件正文。设计原则与回复率预期见 <a href="week/w29.html">W29</a>。</div>
<h2 id="tpl-d">冷邮件模板</h2>
<figure class="code" data-lang="text"><pre><code>主题：请教｜遥感&lt;方向&gt;中&lt;具体问题&gt;的一点困惑 —— &lt;你的姓名&gt;

尊敬的 X 老师：

您好。冒昧来信，我是 &lt;学校/单位&gt; 的 &lt;身份&gt;，方向是 &lt;你的方向&gt;。
过去一年我从 &lt;你的原背景&gt; 转向遥感 CV，独立完成了两项工作
（其一已投 IEEE GRSL，代码开源于 &lt;链接&gt;）。

【第2段 · ★ 证明你真读过他的东西 —— 这一段决定他读不读下去】
我最近仔细读了您 &lt;年份&gt; 发表在 &lt;期刊&gt; 的《&lt;论文标题&gt;》。文中
&lt;具体的某个设计/某个实验现象&gt; 让我印象很深。不过在 &lt;某个具体条件&gt;
下我有一点困惑：&lt;你的问题，2-3 句，具体、技术性、不是能百度到的&gt;。
我在自己的实验里也观察到了类似现象：&lt;你的一个具体数字或现象&gt;。

【第3段 · 我做了什么，一句话带过，不要展开】
我目前的工作是 &lt;一句话&gt;，在 DOTA/DIOR/HRSC 三个数据集上
mAP 相对 baseline 提升 &lt;X.X&gt;（3 个随机种子平均），参数量仅增加 &lt;Y&gt;%，
全部在单张消费级显卡上完成。详细内容在附件的简历和作品集里。

【第4段 · ★ 明确、低门槛的请求】
如果方便的话，不知能否向您请教上面这个问题？
或者，如果您有兴趣，我可以做一个 20 分钟的线上汇报，
介绍我这一年的工作，时间由您定。

打扰了，无论是否方便回复，都感谢您的时间。

顺祝
研安

&lt;你的姓名&gt;
&lt;邮箱&gt; ｜ &lt;GitHub&gt; ｜ &lt;Google Scholar&gt;

附件：简历.pdf ｜ 作品集.pdf ｜ 论文预印本.pdf
</code></pre><button class="copy" type="button" aria-label="复制代码">复制</button></figure>
<figure class="code" data-lang="text"><pre><code>Subject: Question on &lt;specific topic&gt; in your &lt;Year&gt; &lt;Venue&gt; paper — &lt;Your Name&gt;

Dear Prof. X,

I hope this email finds you well. My name is &lt;Name&gt;, a &lt;role&gt; at &lt;affiliation&gt;
working on &lt;your direction&gt;. Over the past year I transitioned from &lt;background&gt;
into remote sensing computer vision, completing two works independently
(one under review at IEEE GRSL; code at &lt;link&gt;).

I recently read your &lt;Year&gt; &lt;Venue&gt; paper &quot;&lt;Title&gt;&quot; with great interest.
The &lt;specific design/finding&gt; was particularly striking to me. I have one
question regarding &lt;specific condition&gt;: &lt;your question, 2-3 sentences&gt;.
In my own experiments I observed something related: &lt;your concrete number&gt;.

My current work &lt;one sentence&gt;. It improves mAP by &lt;X.X&gt; over the baseline
across three benchmarks (averaged over three seeds) with only &lt;Y&gt;% additional
parameters, all trained on a single consumer GPU. Details are in the attached
CV and portfolio.

Would you be open to sharing your thoughts on the question above? Alternatively,
I would be glad to give a 20-minute online presentation on my work at a time
convenient for you.

Thank you very much for your time, regardless of whether you are able to reply.

Best regards,
&lt;Name&gt;
&lt;email&gt; | &lt;GitHub&gt; | &lt;Google Scholar&gt;

Attachments: CV.pdf | Portfolio.pdf | Preprint.pdf
</code></pre><button class="copy" type="button" aria-label="复制代码">复制</button></figure>
